<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="fitnoss — каталог упражнений, конструктор программ и дневник тренировок. Работает офлайн." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Keep the status bar outside the app viewport to avoid iOS standalone overlay/viewport glitches. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>fitnoss</title>
    <script>
      try {
        var t = localStorage.getItem("fitnoss:theme") || "system";
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
        // Custom accent before first paint; the text color on it is recomputed once the app loads.
        var a = localStorage.getItem("fitnoss:accent");
        if (a) {
          document.documentElement.style.setProperty("--accent", a);
          document.documentElement.dataset.accent = "";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
