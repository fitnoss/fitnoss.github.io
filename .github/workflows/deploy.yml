name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Source photos are downloaded once and reused between runs.
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            public/img/ex
          key: exercise-data-${{ hashFiles('scripts/build-data.ts', 'data/id-map.json', 'content/**') }}
          restore-keys: exercise-data-

      # --check fails if a new exercise was added without committing data/id-map.json
      - run: npm run data -- --check
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
